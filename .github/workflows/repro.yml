name: HTTP/2 stream fairness repro

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node:
          [
            "18",
            "20",
            "22.22.0",
            "22.22.1",
            "22.22.2",
            "22.22.3",
            "22.23.0",
            "22.23.1",
            "22.23.2",
            "24",
            "25",
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Run repro and write job summary
        run: |
          set -o pipefail
          OUTPUT=$(node repro.mjs)
          echo "$OUTPUT"
          NODE_V=$(echo "$OUTPUT" | grep '^node ' | sed 's/^node //')
          STATS=$(echo "$OUTPUT" | grep '^min=')
          MIN=$(echo "$STATS" | sed -E 's/.*min=([0-9.]+)s.*/\1/')
          MAX=$(echo "$STATS" | sed -E 's/.*max=([0-9.]+)s.*/\1/')
          SPREAD=$(echo "$STATS" | sed -E 's/.*spread=([0-9.]+)x.*/\1/')
          VERDICT="fair"
          # fair runs are ~1.0x; treat 2x or more as the unfair-scheduling pattern
          if awk "BEGIN{exit !($SPREAD >= 2)}"; then VERDICT="unfair"; fi
          {
            echo "| Node | min | max | spread | verdict |"
            echo "|---|---|---|---|---|"
            echo "| $NODE_V | ${MIN}s | ${MAX}s | ${SPREAD}x | $VERDICT |"
          } >> "$GITHUB_STEP_SUMMARY"
